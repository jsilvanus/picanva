openapi: 3.1.0
info:
  title: picanva API
  version: 0.1.0
  description: Canva slide bridge. Pushes exported Canva pages to piprogram and controls them there. Writes need the API key (Bearer or X-Api-Key) when PICANVA_API_KEY is set.
servers:
  - url: http://127.0.0.1:3100
    description: Pi default
tags:
  - name: System
  - name: Canva
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  mode: { type: string, enum: [simulation, production] }
                  piprogram: { type: string }
  /api/v1/canva/items:
    get:
      operationId: listCanvaItems
      tags: [Canva]
      responses:
        "200":
          description: Canva items pushed since this process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CanvaItem" }
  /api/v1/canva/items/{itemId}:
    get:
      operationId: getCanvaItem
      tags: [Canva]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canva item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvaItem" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/canva/push:
    post:
      operationId: pushCanvaDesign
      tags: [Canva]
      description: Hands the pages of a design to piprogram, one media item per page. Pass exportUrls, or autoExport with CANVA_ACCESS_TOKEN set. Embed-only items are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanvaPushRequest" }
      responses:
        "201":
          description: Pages handed to piprogram
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  item: { $ref: "#/components/schemas/CanvaItem" }
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/canva/control:
    post:
      operationId: controlCanvaPresentation
      tags: [Canva]
      description: Transport and page control, forwarded to piprogram. gotoPage jumps to the item of that page; ftb and mute map to piprogram's FTB and audio routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanvaControlRequest" }
      responses:
        "200":
          description: Action applied; piprogram answers per pipeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  action: { type: string }
                  pipelines:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object, additionalProperties: true }
  schemas:
    CanvaPushRequest:
      type: object
      required: [designId]
      properties:
        designId: { type: string, description: Design id or Canva design URL }
        title: { type: string }
        exportUrls:
          type: array
          maxItems: 200
          items: { type: string, format: uri, description: https URL on an allowed Canva host, one per page }
        exportFormat: { type: string, enum: [png, mp4], default: png }
        autoExport: { type: boolean, default: false }
        orientation: { type: string, enum: [landscape, portrait], default: landscape }
        targetPipelineId: { type: string, enum: [PiPGM1, PiPGM2, PiPGM3], default: PiPGM1 }
        cueImmediately: { type: boolean, default: true }
        pushedFromCanvaApp: { type: boolean, default: false }
    CanvaControlRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [next, prev, gotoPage, ftb, mute, play, pause, stop, restart]
        designId: { type: string }
        pageNumber: { type: integer, minimum: 1 }
        targetPipelineId: { type: string, enum: [PiPGM1, PiPGM2, PiPGM3, all] }
        fadeToBlack: { type: boolean }
        toggle: { type: boolean }
        audioEnabled: { type: boolean }
    CanvaItem:
      type: object
      properties:
        id: { type: string }
        designId: { type: string }
        title: { type: string }
        format: { type: string, enum: [png, mp4] }
        targetPipelineId: { type: string }
        pushedFromCanvaApp: { type: boolean }
        status: { type: string, enum: [handing_off, handed_off, partial] }
        error: { type: [string, "null"] }
        createdAt: { type: string }
        pages:
          type: array
          items:
            type: object
            properties:
              pageNumber: { type: integer }
              piprogramItemId: { type: string }
