openapi: 3.1.0
info:
  title: Pi Gateway - Canva Plugin API
  version: 1.0.0
  description: >-
    Restricted Pi Gateway endpoints exposed for the Canva App plugin (picanva).
    Allows uploading Canva slide exports directly into Pi Program storage,
    configuring the presentation pipeline and Pi Matrix display routing,
    and executing live presentation commands (slide stepper, FTB, projector pic mute).
servers:
  - url: https://gateway.keskuskirkko.fi:8443
    description: Production Church Gateway
  - url: http://127.0.0.1:8080
    description: Local Dev Gateway
security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /api/v1/canva/push:
    post:
      summary: Step 1 - Push Content
      description: >-
        Takes exported Canva page images and saves them into Pi Program's media storage.
        Staging content does not alter live displays or active presentation state.
      operationId: pushCanvaContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, pages]
              properties:
                title:
                  type: string
                  example: Sunday Service 2026-11-01
                pages:
                  type: array
                  items:
                    type: object
                    required: [pageNumber, url]
                    properties:
                      pageNumber:
                        type: integer
                        example: 1
                      url:
                        type: string
                        format: uri
                        example: https://export.canva.com/abc123xyz/page-1.png
                      name:
                        type: string
                        example: Page 1
      responses:
        "201":
          description: Media saved in Pi Program
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  presentationId: { type: string, example: pres_89f02c4 }
                  title: { type: string, example: Sunday Service 2026-11-01 }
                  pageCount: { type: integer, example: 14 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Pi Program storage upload failure

  /api/v1/canva/setup:
    post:
      summary: Step 2 - Presentation Setup
      description: >-
        Arms a staged presentation on a selected Pi Program pipeline,
        switches Pi Matrix routing to target displays (e.g. projectors or landscape screen),
        and optionally clears projector Picture Mute.
      operationId: setupCanvaPresentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentationId, pipelineId, matrixRoute]
              properties:
                presentationId:
                  type: string
                  example: pres_89f02c4
                pipelineId:
                  type: string
                  enum: [pipgm1, pipgm2]
                  example: pipgm1
                matrixRoute:
                  type: string
                  enum: [both_projectors, landscape_screen, all_displays, none]
                  example: both_projectors
                unblankProjectors:
                  type: boolean
                  default: true
                  example: true
                cueSlide:
                  type: integer
                  default: 1
                  example: 1
      responses:
        "200":
          description: Pipeline configured and routed live
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pipelineId: { type: string, example: pipgm1 }
                  matrixRoute: { type: string, example: both_projectors }
                  picMute: { type: boolean, example: false }
                  currentSlide: { type: integer, example: 1 }

  /api/v1/canva/control:
    post:
      summary: Step 3 - Live Presentation Slide & Output Control
      description: >-
        Advances or cues slides, toggles Fade to Black (FTB) on Pi Program,
        and controls projector beam hardware blanking (picMute).
      operationId: controlCanvaPresentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                pipelineId:
                  type: string
                  enum: [pipgm1, pipgm2]
                  example: pipgm1
                action:
                  type: string
                  enum: [next, prev, gotoPage, ftb, picMute]
                  example: next
                page:
                  type: integer
                  description: Required when action is gotoPage
                  example: 3
                enabled:
                  type: boolean
                  description: Required when action is ftb
                  example: true
                muted:
                  type: boolean
                  description: Required when action is picMute (true to blank beam, false to open beam)
                  example: false
      responses:
        "200":
          description: Control action executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  currentPage: { type: integer, example: 2 }
                  ftb: { type: boolean, example: false }
                  muted: { type: boolean, example: false }

  /api/v1/canva/status:
    get:
      summary: Presentation and Gateway Health Status
      description: Polls current pipeline state, active slide, FTB, and projector shutter.
      operationId: getCanvaStatus
      parameters:
        - in: query
          name: pipelineId
          schema:
            type: string
            enum: [pipgm1, pipgm2]
            default: pipgm1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: { type: boolean, example: true }
                  pipelineId: { type: string, example: pipgm1 }
                  matrixRoute: { type: string, example: both_projectors }
                  currentSlide: { type: integer, example: 3 }
                  totalSlides: { type: integer, example: 14 }
                  ftb: { type: boolean, example: false }
                  picMute: { type: boolean, example: false }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  responses:
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Unauthorized }
              message: { type: string, example: Invalid Canva API token }
